[workspace]
members = ["pdf-evidence", "pdf-guest", "pdf-runner"]
default-members = ["pdf-evidence"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.94"
version = "0.1.0"
publish = false

[workspace.dependencies]
sha2 = { version = "=0.10.9", features = ["oid"] }
serde = { version = "=1.0.228", features = ["derive"] }
hex = "=0.4.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
