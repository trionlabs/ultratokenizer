[package]
name = "ultratokenizer-network-requester"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[workspace]
resolver = "2"

[dependencies]
bincode = "=1.3.3"
hex = "=0.4.3"
prost = "=0.13.5"
reqwest = { version = "=0.12.28", default-features = false, features = [
  "rustls-tls",
] }
rustls = "=0.23.27"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
sp1-sdk = { version = "=6.2.4", default-features = false, features = [
  "network",
] }
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread"] }
tonic = { version = "=0.12.3", features = ["tls", "tls-roots"] }
ultratokenizer-claim-evidence = { path = "../claim-evidence" }
ultratokenizer-network-request-schema = { path = "../network-request-schema" }
zstd = "=0.13.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
