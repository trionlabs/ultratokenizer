name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            workers/issuance/package-lock.json
            packages/hedera-provisioning/package-lock.json
      - run: npm ci --no-audit
      - run: npm --prefix apps/web ci --no-audit
      - run: npm --prefix workers/issuance ci --no-audit
      - run: npm --prefix packages/hedera-provisioning ci --ignore-scripts --no-audit
      - run: npm run check
      - run: npm run build
      - run: npm run build:web
      - run: npm run build:workers

  browser-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci --no-audit
      - run: npm --prefix apps/web ci --no-audit
      - run: npm run build:web
      - name: Install the pinned browser runtime
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Verify the production browser worker
        run: |
          npm --prefix apps/web run preview -- --port 4173 > /tmp/ultratokenizer-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/verify/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/verify/ > /dev/null
          npm --prefix apps/web run test:browser
          npm --prefix apps/web run test:browser:backends
          npm --prefix apps/web run test:browser:institution

  ats-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/ats/package-lock.json
            packages/hedera-provisioning/package-lock.json
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1
      - run: npm ci --no-audit
      - run: npm --prefix contracts/ats ci --ignore-scripts --no-audit
      - run: npm --prefix packages/hedera-provisioning ci --ignore-scripts --no-audit
      - run: npm --prefix contracts/ats run compiler:fetch
      - name: Test Gate and ATS state transitions with an isolated test verifier
        run: npm run check:ats
      - name: Check native HFS signing, uncertainty and actual ATS input hydration
        run: |
          npm run check:hedera-provisioning
          npm run check:ats:hfs

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1
      - run: forge fmt --root contracts --check
      - run: forge test --root contracts

  network-requester:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install the validated native Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Check isolated requester with offline transports and synthetic journals
        run: npm run check:network-requester

  native-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    defaults:
      run:
        working-directory: proofs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the validated native Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.96.0 fmt --all -- --check
      - name: Check identity comparison policy
        run: python3 ../.github/scripts/test-claim-identity.py
      - name: Install checksum-pinned SP1 CLI and guest Rust
        run: bash .github/scripts/install-sp1.sh
        working-directory: .
      - run: cargo +1.96.0 test --locked -p ultratokenizer-pdf-evidence -p ultratokenizer-claim-evidence -p ultratokenizer-claim-runner -p ultratokenizer-pdf-runner -p ultratokenizer-network-request-schema --all-targets
      - run: cargo +1.96.0 clippy --locked -p ultratokenizer-pdf-evidence -p ultratokenizer-claim-evidence -p ultratokenizer-claim-runner -p ultratokenizer-pdf-runner -p ultratokenizer-network-request-schema --all-targets -- -D warnings
      - name: Check the separate native Enpara extraction profile
        run: |
          cargo +1.96.0 fmt --manifest-path enpara-evidence/Cargo.toml -- --check
          cargo +1.96.0 test --manifest-path enpara-evidence/Cargo.toml --locked --all-targets
          cargo +1.96.0 clippy --manifest-path enpara-evidence/Cargo.toml --locked --all-targets -- -D warnings
      - name: Check the synthetic fixture generator
        run: python3 tools/test_generate_fixture.py
      - run: cargo +1.96.0 build --locked -p ultratokenizer-claim-runner -p ultratokenizer-pdf-runner
      - name: Build a path-remapped candidate without replacing reviewed pins
        run: python3 tools/build-claim-guest.py
      - name: Execute the actual guest and record its identity
        run: |
          test -s target/normalized-elf/ultratokenizer-claim-guest
          target/debug/ultratokenizer-claim-runner self-test target/normalized-elf/ultratokenizer-claim-guest
          target/debug/ultratokenizer-claim-runner identity target/normalized-elf/ultratokenizer-claim-guest > target/ci-claim-identity.json
          sha256sum target/normalized-elf/ultratokenizer-claim-guest
          cat target/ci-claim-identity.json
      - name: Record candidate gaps without admitting a replacement program
        run: python3 ../.github/scripts/check-claim-identity.py target/ci-claim-identity.json target/normalized-elf/ultratokenizer-claim-guest target/ci-claim-comparison.json --mode record-candidate
      - name: Preserve candidate identity comparison in the job log
        if: always()
        run: |
          if test -f target/ci-claim-comparison.json; then
            cat target/ci-claim-comparison.json
            printf '### SP1 candidate identity (not a proof or deployment approval)\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat target/ci-claim-comparison.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  request-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the validated native Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - run: npm run check:parity
